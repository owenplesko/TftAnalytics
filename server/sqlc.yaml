version: "2"
servers:
  - engine: "postgresql"
    uri: "postgres://postgres@localhost:5432/postgres?sslmode=disable"
sql:
  - engine: "postgresql"
    database:
      managed: true
    queries: "sql/queries"
    schema: "sql/migrations"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        json_tags_case_style: "camel"
        overrides:
          - column: "tft_comp.comp_data"
            go_type:
              type: "CompData"  
