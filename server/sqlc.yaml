version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/sql/queries"
    schema: "internal/db/sql/schema.sql"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        json_tags_case_style: "camel"
        overrides:
          - column: "tft_comp.comp_data"
            go_type:
              type: "CompData"
